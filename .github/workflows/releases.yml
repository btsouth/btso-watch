name: Check releases (manual)

# The regular check runs as a Cloudflare Worker on a 5-minute cron (see
# worker/), because GitHub never registered this workflow's schedule. This
# stays as a manual way to run the same check from GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: check
        run: node watch.mjs
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Record the dispatch
        if: steps.check.outputs.dispatched != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Refresh btso.dev for ${{ steps.check.outputs.dispatched }}"
          git push
