name: Watch releases

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: check
        run: node watch.mjs
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Record the dispatch
        if: steps.check.outputs.dispatched != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Refresh btso.dev for ${{ steps.check.outputs.dispatched }}"
          git push

      # GitHub pauses schedules in public repos after 60 days without activity.
      # Re-enabling the workflow through the API resets that clock.
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
